[project]
name = "link-web"
version = "0.1.0"
description = "Public sign-in page linking a WhatsApp number to a Google account."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "google-auth[requests]>=2.40",
    "google-cloud-firestore>=2.19",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["link_web"]
