[project]
name = "image-generator"
version = "0.1.0"
description = "Generates order images from order-created events and publishes order-ready."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "google-cloud-storage>=2.18",
    "google-genai>=1.50",
    # Cloudflare Workers AI image models.
    "httpx>=0.27",
    "pillow>=11",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_generator"]
