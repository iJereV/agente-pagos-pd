[project]
name = "wa-webhook"
version = "0.1.0"
description = "Public WhatsApp webhook: verifies Meta's signature and enqueues each message on wa-inbound."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wa_webhook"]
