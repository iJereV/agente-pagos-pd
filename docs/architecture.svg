<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 740" width="1340" height="740" role="img" aria-label="Component diagram. Top row, the conversation path from left to right: customer, Meta WhatsApp Cloud API, the public wa-webhook service, the wa-inbound Pub/Sub topic, the private main-worker service, the shop agent on Agent Runtime and its models on Vertex AI (gpt-oss-120b for the agent, Llama 4 for receipts). main-worker sends replies and images back to Meta. Below the agent, mcp-shop talks to Mercado Pago, Llama 4 for receipt extraction and Firestore, and publishes order-created. The image generator consumes order-created, calls FLUX.1 [schnell] on Cloudflare Workers AI, stores images in Cloud Storage and publishes order-ready, which is pushed to main-worker. main-worker reads identity and sessions from Firestore and images from Cloud Storage. link-web signs customers in with Google through Identity Platform and writes the binding to Firestore.">
  <title>agente-pagos-pd component architecture</title>
  <style>
    svg { color: #1b2420; }
    .bg { fill: #ffffff; }
    .n-ours rect { fill: #dcefe9; stroke: #0f6e5c; stroke-width: 2; }
    .n-managed rect { fill: #eef1f6; stroke: #8a97ad; stroke-width: 1.5; }
    .n-ext rect { fill: #ffffff; stroke: #b45d12; stroke-width: 2; stroke-dasharray: 6 4; }
    .n-title { font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1b2420; }
    .n-sub { font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #5b6862; }
    .divider { stroke: #0f6e5c; stroke-width: 1; }
    .edge { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .edge.money { stroke: #0f6e5c; stroke-width: 2; }
    .e-label { font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #1b2420; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .legend-text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; fill: #5b6862; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e4ebe7; }
      .bg { fill: #1a211e; }
      .n-ours rect { fill: #173a32; stroke: #4cc3a7; }
      .n-managed rect { fill: #1d2330; stroke: #7d8aa3; }
      .n-ext rect { fill: #1a211e; stroke: #f0a35e; }
      .n-title { fill: #e4ebe7; }
      .n-sub { fill: #9aa8a1; }
      .divider { stroke: #4cc3a7; }
      .edge.money { stroke: #4cc3a7; }
      .e-label { fill: #e4ebe7; stroke: #1a211e; }
      .legend-text { fill: #9aa8a1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1340" height="740" rx="10"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- conversation spine -->
  <line class="edge" x1="180" y1="152" x2="210" y2="152" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="e-label" x="195" y="108" text-anchor="middle">chat</text>
  <line class="edge" x1="370" y1="152" x2="400" y2="152" marker-end="url(#arr)"/>
  <text class="e-label" x="385" y="108" text-anchor="middle">webhook</text>
  <line class="edge" x1="560" y1="152" x2="590" y2="152" marker-end="url(#arr)"/>
  <text class="e-label" x="575" y="108" text-anchor="middle">enqueue</text>
  <line class="edge" x1="750" y1="152" x2="780" y2="152" marker-end="url(#arr)"/>
  <text class="e-label" x="765" y="108" text-anchor="middle">push</text>
  <line class="edge" x1="940" y1="152" x2="970" y2="152" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="e-label" x="955" y="108" text-anchor="middle">turn ⇄ reply</text>
  <line class="edge" x1="1130" y1="152" x2="1160" y2="152" marker-end="url(#arr)"/>
  <text class="e-label" x="1145" y="108" text-anchor="middle">LLM</text>
  <!-- main-worker -> meta (send) -->
  <polyline class="edge" points="820,120 820,70 290,70 290,120" marker-end="url(#arr)"/>
  <text class="e-label" x="555" y="62" text-anchor="middle">send text + images</text>

  <!-- agent -> mcp -->
  <line class="edge" x1="1050" y1="184" x2="1050" y2="300" marker-end="url(#arr)"/>
  <text class="e-label" x="1042" y="236" text-anchor="end">tools + turn token</text>
  <!-- mcp -> gemini (extract) -->
  <polyline class="edge" points="1110,300 1110,250 1240,250 1240,184" marker-end="url(#arr)"/>
  <text class="e-label" x="1175" y="242" text-anchor="middle">extract receipt</text>
  <!-- mcp -> mp -->
  <line class="edge money" x1="1130" y1="332" x2="1160" y2="332" marker-end="url(#arr)"/>
  <text class="e-label" x="1145" y="288" text-anchor="middle">search</text>
  <!-- mcp -> firestore -->
  <polyline class="edge money" points="1000,440 1000,470 530,470 530,364" marker-end="url(#arr)"/>
  <text class="e-label" x="600" y="462" text-anchor="middle">orders · payments · balance</text>
  <!-- mcp -> order-created -->
  <line class="edge" x1="1080" y1="440" x2="1080" y2="500" marker-end="url(#arr)"/>
  <text class="e-label" x="1088" y="476" text-anchor="start">create_order</text>

  <!-- main-worker -> firestore -->
  <polyline class="edge" points="830,184 830,240 480,240 480,300" marker-end="url(#arr)"/>
  <text class="e-label" x="640" y="232" text-anchor="middle">identity · sessions</text>
  <!-- main-worker -> gcs -->
  <line class="edge" x1="900" y1="184" x2="900" y2="300" marker-end="url(#arr)"/>
  <text class="e-label" x="908" y="276" text-anchor="start">read images</text>

  <!-- generation -->
  <line class="edge" x1="970" y1="532" x2="940" y2="532" marker-end="url(#arr)"/>
  <text class="e-label" x="955" y="490" text-anchor="middle">push</text>
  <line class="edge" x1="780" y1="532" x2="750" y2="532" marker-end="url(#arr)"/>
  <text class="e-label" x="765" y="490" text-anchor="middle">publish</text>
  <line class="edge" x1="860" y1="500" x2="860" y2="364" marker-end="url(#arr)"/>
  <text class="e-label" x="852" y="420" text-anchor="end">store</text>
  <line class="edge" x1="860" y1="564" x2="860" y2="660" marker-end="url(#arr)"/>
  <text class="e-label" x="868" y="616" text-anchor="start">generate</text>
  <!-- order-ready -> main-worker -->
  <polyline class="edge" points="670,500 670,270 790,270 790,184" marker-end="url(#arr)"/>
  <text class="e-label" x="678" y="330" text-anchor="start">push</text>

  <!-- linking -->
  <line class="edge" x1="100" y1="184" x2="100" y2="300" marker-end="url(#arr)"/>
  <text class="e-label" x="100" y="246" text-anchor="middle">opens link</text>
  <line class="edge" x1="180" y1="332" x2="210" y2="332" marker-end="url(#arr)"/>
  <line class="edge" x1="370" y1="332" x2="400" y2="332" marker-end="url(#arr)"/>
  <text class="e-label" x="385" y="388" text-anchor="middle">bind · sign-in</text>
  <line class="edge" x1="290" y1="364" x2="290" y2="500" marker-end="url(#arr)"/>
  <text class="e-label" x="290" y="436" text-anchor="middle">Google sign-in</text>

  <!-- nodes: spine -->
  <g class="n-ext"><rect x="20" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="100" y="147" text-anchor="middle">Customer</text>
    <text class="n-sub" x="100" y="166" text-anchor="middle">WhatsApp app</text></g>
  <g class="n-ext"><rect x="210" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="290" y="147" text-anchor="middle">Meta Cloud API</text>
    <text class="n-sub" x="290" y="166" text-anchor="middle">WhatsApp Business</text></g>
  <g class="n-ours"><rect x="400" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="480" y="147" text-anchor="middle">wa-webhook</text>
    <text class="n-sub" x="480" y="166" text-anchor="middle">Cloud Run · public</text></g>
  <g class="n-managed"><rect x="590" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="670" y="147" text-anchor="middle">Pub/Sub</text>
    <text class="n-sub" x="670" y="166" text-anchor="middle">wa-inbound</text></g>
  <g class="n-ours"><rect x="780" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="860" y="147" text-anchor="middle">main-worker</text>
    <text class="n-sub" x="860" y="166" text-anchor="middle">Cloud Run · private</text></g>
  <g class="n-ours"><rect x="970" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="1050" y="147" text-anchor="middle">Shop agent (ADK)</text>
    <text class="n-sub" x="1050" y="166" text-anchor="middle">Agent Runtime</text></g>
  <g class="n-managed"><rect x="1160" y="120" width="160" height="64" rx="8"/>
    <text class="n-title" x="1240" y="147" text-anchor="middle">Vertex AI models</text>
    <text class="n-sub" x="1240" y="166" text-anchor="middle">gpt-oss-120b · Llama 4</text></g>
  <!-- row 2 -->
  <g class="n-ext"><rect x="20" y="300" width="160" height="64" rx="8"/>
    <text class="n-title" x="100" y="327" text-anchor="middle">Customer</text>
    <text class="n-sub" x="100" y="346" text-anchor="middle">browser</text></g>
  <g class="n-ours"><rect x="210" y="300" width="160" height="64" rx="8"/>
    <text class="n-title" x="290" y="327" text-anchor="middle">link-web</text>
    <text class="n-sub" x="290" y="346" text-anchor="middle">Cloud Run · public</text></g>
  <g class="n-managed"><rect x="400" y="300" width="160" height="64" rx="8"/>
    <text class="n-title" x="480" y="327" text-anchor="middle">Firestore</text>
    <text class="n-sub" x="480" y="346" text-anchor="middle">dbs: channel · shop</text></g>
  <g class="n-managed"><rect x="780" y="300" width="160" height="64" rx="8"/>
    <text class="n-title" x="860" y="327" text-anchor="middle">Cloud Storage</text>
    <text class="n-sub" x="860" y="346" text-anchor="middle">orders/ · receipts/</text></g>
  <g class="n-ours"><rect x="970" y="300" width="160" height="140" rx="8"/>
    <text class="n-title" x="1050" y="324" text-anchor="middle">mcp-shop</text>
    <text class="n-sub" x="1050" y="342" text-anchor="middle">Cloud Run · private</text>
    <line x1="986" y1="352" x2="1114" y2="352" class="divider"/>
    <text class="n-sub" x="986" y="372" text-anchor="start">get_balance</text>
    <text class="n-sub" x="986" y="390" text-anchor="start">create_order</text>
    <text class="n-sub" x="986" y="408" text-anchor="start">verify_receipt</text>
    <text class="n-sub" x="986" y="426" text-anchor="start">get_order_status</text></g>
  <g class="n-ext"><rect x="1160" y="300" width="160" height="64" rx="8"/>
    <text class="n-title" x="1240" y="327" text-anchor="middle">Mercado Pago</text>
    <text class="n-sub" x="1240" y="346" text-anchor="middle">/v1/payments/search</text></g>
  <!-- row 3 -->
  <g class="n-managed"><rect x="210" y="500" width="160" height="64" rx="8"/>
    <text class="n-title" x="290" y="527" text-anchor="middle">Identity Platform</text>
    <text class="n-sub" x="290" y="546" text-anchor="middle">Google provider</text></g>
  <g class="n-managed"><rect x="590" y="500" width="160" height="64" rx="8"/>
    <text class="n-title" x="670" y="527" text-anchor="middle">Pub/Sub</text>
    <text class="n-sub" x="670" y="546" text-anchor="middle">order-ready</text></g>
  <g class="n-ours"><rect x="780" y="500" width="160" height="64" rx="8"/>
    <text class="n-title" x="860" y="527" text-anchor="middle">image-generator</text>
    <text class="n-sub" x="860" y="546" text-anchor="middle">Cloud Run · A2A later</text></g>
  <g class="n-managed"><rect x="970" y="500" width="160" height="64" rx="8"/>
    <text class="n-title" x="1050" y="527" text-anchor="middle">Pub/Sub</text>
    <text class="n-sub" x="1050" y="546" text-anchor="middle">order-created</text></g>
  <!-- row 4 -->
  <g class="n-ext"><rect x="780" y="660" width="160" height="64" rx="8"/>
    <text class="n-title" x="860" y="687" text-anchor="middle">FLUX.1 [schnell]</text>
    <text class="n-sub" x="860" y="706" text-anchor="middle">Cloudflare Workers AI</text></g>

  <!-- legend -->
  <g transform="translate(20 664)">
    <g class="n-ours"><rect x="0" y="0" width="18" height="12" rx="3"/></g>
    <text class="legend-text" x="26" y="10">Our services</text>
    <g class="n-managed"><rect x="0" y="22" width="18" height="12" rx="3"/></g>
    <text class="legend-text" x="26" y="32">Managed GCP</text>
    <g class="n-ext"><rect x="140" y="0" width="18" height="12" rx="3"/></g>
    <text class="legend-text" x="166" y="10">Third party</text>
    <line class="edge money" x1="140" y1="28" x2="158" y2="28"/>
    <text class="legend-text" x="166" y="32">Money path</text>
  </g>
</svg>
