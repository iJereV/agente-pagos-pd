[project]
name = "agente-pagos-pd"
version = "0.1.0"
description = "WhatsApp shop agent on Google Cloud: prepaid orders, Mercado Pago receipt verification and generated images."
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "libs/shared",
    "services/wa-webhook",
    "services/main-worker",
    "services/mcp-shop",
    "services/image-generator",
    "services/link-web",
    "agent",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["libs", "services", "agent"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
