[project]
name = "shop-agent"
version = "0.1.0"
description = "ADK shop agent deployed to Agent Runtime (Vertex AI Agent Engine)."
requires-python = ">=3.12"
dependencies = [
    "google-adk[mcp]>=2.15",
    "google-auth[requests]>=2.40",
    # AdkApp and the deploy client; Agent Runtime also installs it in the container.
    "google-cloud-aiplatform[agent_engines,adk]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shop_agent"]
