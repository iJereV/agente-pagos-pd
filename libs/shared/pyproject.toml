[project]
name = "shared"
version = "0.1.0"
description = "Shared helpers: signed tokens, Pub/Sub envelopes, structured logging and env config."
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.9",
    "google-cloud-iam>=2.15",
    "google-cloud-pubsub>=2.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
